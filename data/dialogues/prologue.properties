intro.count=7
intro.0.speaker=AURORA · 2053
intro.0.text=O rádio ficou mudo às 02h17. Um minuto depois, as estrelas desapareceram.
intro.0.expression=narrator
intro.1.speaker=LIA TORRES
intro.1.text={hero}. Aqui. Olha para mim, não para aquela coisa no céu.
intro.1.expression=worried
intro.2.speaker={hero}
intro.2.text=Tem alguém chamando. Dentro da minha cabeça.
intro.2.expression=worried
intro.3.speaker=DAVI · RÁDIO
intro.3.text=Se esse rádio ainda funciona, vão para a estação. Tenho um sinal. Antigo demais para ser daqui.
intro.3.expression=radio
intro.4.speaker=LIA TORRES
intro.4.text=Ótimo. Um mistério. Eu estava com medo de esta noite ser simples.
intro.4.expression=tired
intro.5.speaker=UMA VOZ NA RUA
intro.5.text=Mãe? Eu... não consigo encontrar a porta.
intro.5.expression=distorted
intro.6.speaker=LIA TORRES
intro.6.text=Essa voz vinha do hospital ontem. O hospital caiu há três dias.
intro.6.expression=worried
