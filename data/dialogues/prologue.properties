survivor.1.text=Meu nome é Lia. Eu consigo tirar essa viga. Você consegue mexer os dedos?
survivor.1.expression=determined
survivor.2.speaker=DAVI · RÁDIO
survivor.2.text=A fenda está descendo. Vocês têm minutos. E essa rua não vai continuar existindo por muito tempo.
survivor.2.expression=radio
survivor.3.speaker=LIA TORRES
survivor.3.text={hero}, me ajuda a decidir. Não vou fingir que é fácil.
survivor.3.expression=worried
