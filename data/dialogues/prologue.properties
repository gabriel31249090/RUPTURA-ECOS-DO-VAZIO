intro_pragmatic.0.expression=determined
intro_pragmatic.1.speaker={hero}
intro_pragmatic.1.text=Eu não disse que ia deixar ninguém para trás.
intro_pragmatic.1.expression=neutral
intro_curious.count=2
intro_curious.0.speaker=LIA TORRES
intro_curious.0.text=Alguns repetem. Outros respondem. Essa é a parte que me tira o sono.
intro_curious.0.expression=worried
intro_curious.1.speaker={hero}
intro_curious.1.text=Então vamos descobrir qual deles é.
intro_curious.1.expression=determined

lia.count=3
lia.0.speaker=LIA TORRES
lia.0.text=A avenida leva até o rádio. Tem um estojo perto da ambulância; pega o que conseguir.
lia.0.expression=neutral
lia.1.speaker=LIA TORRES
lia.1.text=No combate, tenta mudar de posição antes de atacar. Eu cuido dos ferimentos.
lia.1.expression=determined
lia.2.speaker={hero}
lia.2.text=E quem cuida dos seus?
lia.2.expression=soft

crate.count=2
crate.0.speaker={hero}
crate.0.text=Um estojo de primeiros socorros. E peças que o Davi chamaria de "perfeitamente utilizáveis".
crate.0.expression=neutral
crate.1.speaker=LIA TORRES
crate.1.text=Ele chama um rádio pegando fogo de "quase consertado". Guarda mesmo assim.
crate.1.expression=soft

combatIntro.count=3
combatIntro.0.speaker=LIA TORRES
combatIntro.0.text=Três deles. O que corre chega primeiro. Não deixa ele nos separar.
combatIntro.0.expression=determined
combatIntro.1.speaker={hero}
combatIntro.1.text=Os cristais... eles vibram quando eu me aproximo.
combatIntro.1.expression=worried
combatIntro.2.speaker=LIA TORRES
combatIntro.2.text=Então usa isso. E depois você me conta desde quando faz cristais vibrarem.
combatIntro.2.expression=determined

firstVictory.count=3
firstVictory.0.speaker={hero}
firstVictory.0.text=Eu ouvi uma cozinha. Água fervendo. Alguém cantando. Por um segundo, eu estava lá.
firstVictory.0.expression=worried
firstVictory.1.speaker=LIA TORRES
firstVictory.1.text=Respira. A rua está aqui. Eu estou aqui.
firstVictory.1.expression=soft
firstVictory.2.speaker=DAVI · RÁDIO
firstVictory.2.text=Detesto interromper uma crise existencial, mas o sinal está ficando mais forte. Continuem.
firstVictory.2.expression=radio

