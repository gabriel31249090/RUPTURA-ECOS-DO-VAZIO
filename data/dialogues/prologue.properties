intro_empathy.count=2
intro_empathy.0.speaker=LIA TORRES
intro_empathy.0.text=Eu quero acreditar nisso. Só não chega perto sem mim, está bem?
intro_empathy.0.expression=soft
intro_empathy.1.speaker={hero}
intro_empathy.1.text=Combinado. Vamos juntos.
intro_empathy.1.expression=determined
intro_pragmatic.count=2
intro_pragmatic.0.speaker=LIA TORRES
